<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2V Driver | Ma Tournée</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #2d6a4f;
            --medium-green: #52b788;
            --light-bg: #f8fcf9;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--light-bg); color: #333; max-width: 430px; margin: 0 auto; min-height: 100vh; }

        /* Login Screen */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; text-align: center; }
        .login-card { background: var(--white); padding: 30px; border-radius: 20px; box-shadow: var(--shadow); width: 100%; }
        .login-card i { font-size: 3rem; color: var(--primary-green); margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin: 15px 0; border: 2px solid #eee; border-radius: 10px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--medium-green); }
        .btn-main { width: 100%; padding: 15px; background: var(--primary-green); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; }

        /* Route Screen */
        #route-screen { display: none; padding-bottom: 100px; }
        .header-banner { background: linear-gradient(135deg, var(--primary-green), var(--medium-green)); color: white; padding: 25px 20px; border-radius: 0 0 25px 25px; box-shadow: var(--shadow); }
        .header-stats { display: flex; justify-content: space-between; margin-top: 15px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; }

        .btn-maps { display: block; margin: 20px; padding: 18px; background: #4285F4; color: white; text-align: center; text-decoration: none; border-radius: 12px; font-weight: bold; box-shadow: 0 4px 10px rgba(66, 133, 244, 0.3); }

        .stops-container { padding: 0 15px; }
        .stop-card { background: var(--white); margin-bottom: 15px; border-radius: 15px; padding: 15px; display: flex; align-items: flex-start; gap: 15px; box-shadow: var(--shadow); position: relative; border-left: 5px solid var(--medium-green); }
        .stop-number { background: var(--primary-green); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .stop-info { flex: 1; }
        .stop-info h4 { margin-bottom: 5px; font-size: 1.1rem; }
        .stop-info p { font-size: 0.9rem; color: #666; margin-bottom: 10px; }
        
        .badge { display: inline-block; padding: 4px 8px; background: #e8f5e9; color: var(--primary-green); border-radius: 5px; font-size: 0.75rem; font-weight: bold; }
        .btn-nav { display: inline-flex; align-items: center; gap: 5px; color: #4285F4; text-decoration: none; font-weight: bold; font-size: 0.9rem; margin-top: 10px; }

        .checkbox-done { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .checkbox-done.active { background: var(--medium-green); border-color: var(--medium-green); color: white; }

        /* Stats Footer */
        .footer-stats { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: white; padding: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; border-top: 1px solid #eee; }
        .stat-small { text-align: center; }
        .stat-small div:first-child { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        .stat-small div:last-child { font-weight: bold; color: var(--primary-green); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <i class="fas fa-truck-fast"></i>
            <h2>V2V Driver</h2>
            <p>Accédez à votre tournée du jour</p>
            <input type="number" id="driver-id" placeholder="Entrez votre ID Chauffeur">
            <button class="btn-main" onclick="loadRoute()">VOIR MA TOURNÉE</button>
        </div>
    </div>

    <div id="route-screen">
        <div class="header-banner">
            <h2 id="welcome-msg">Bonjour ! 👋</h2>
            <div class="header-stats">
                <div><strong id="stat-colis">0</strong><br><small>Colis</small></div>
                <div><strong id="stat-dist">0</strong><br><small>Km</small></div>
                <div><strong id="stat-gain">0</strong><br><small>Gain DT</small></div>
            </div>
        </div>

        <a href="#" id="global-map-link" target="_blank" class="btn-maps">
            <i class="fas fa-map-location-dot"></i> OUVRIR L'ITINÉRAIRE COMPLET
        </a>

        <div class="stops-container" id="stops-list">
            </div>

        <div class="footer-stats">
            <div class="stat-small"><div>Routes</div><div id="hist-routes">0</div></div>
            <div class="stat-small"><div>Total Colis</div><div id="hist-colis">0</div></div>
            <div class="stat-small"><div>Gain Vie</div><div id="hist-gain">0</div></div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8080/api/driver";

        async function loadRoute() {
            const driverId = document.getElementById('driver-id').value;
            if (!driverId) return alert("Veuillez entrer un ID");

            try {
                // 1. Fetch Route
                const res = await fetch(`${API_BASE}/${driverId}/route`);
                if (!res.ok) throw new Error("Aucune tournée trouvée");
                const data = await res.json();

                // 2. Fetch Personal Stats
                const resStats = await fetch(`${API_BASE}/${driverId}/stats`);
                const stats = await resStats.json();

                // Affichage
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('route-screen').style.display = 'block';

                document.getElementById('welcome-msg').innerText = `Bonjour ${data.driver_name} 👋`;
                document.getElementById('stat-colis').innerText = data.nb_colis;
                document.getElementById('stat-dist').innerText = data.total_distance;
                document.getElementById('stat-gain').innerText = data.gain_net.toFixed(2);
                document.getElementById('global-map-link').href = data.map_url;

                // Historique
                document.getElementById('hist-routes').innerText = stats.total_routes_done;
                document.getElementById('hist-colis').innerText = stats.total_colis_delivered;
                document.getElementById('hist-gain').innerText = stats.total_gain + " DT";

                // Liste des arrêts
                const list = document.getElementById('stops-list');
                list.innerHTML = "";
                data.stops.forEach((stop, index) => {
                    list.innerHTML += `
                        <div class="stop-card">
                            <div class="stop-number">${stop.seq}</div>
                            <div class="stop-info">
                                <h4>${stop.expediteur}</h4>
                                <p>${stop.addr}</p>
                                <span class="badge">${stop.gouvernorat}</span><br>
                                <a href="${stop.nav_url}" target="_blank" class="btn-nav">
                                    <i class="fas fa-location-arrow"></i>📍 Naviguer
                                </a>
                            </div>
                            <div class="checkbox-done" onclick="this.classList.toggle('active')">
                                <i class="fas fa-check"></i>
                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>
</html>
