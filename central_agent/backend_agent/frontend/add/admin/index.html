<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2V Routing Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f0faf0;
            --sidebar-color: #1b4332;
            --accent-green: #2d6a4f;
            --medium-green: #52b788;
            --light-green: #b7e4c7;
            --white: #ffffff;
            --text-dark: #081c15;
            --red-alert: #d00000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 250px; background: var(--sidebar-color); color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { margin-bottom: 30px; font-size: 1.2rem; text-align: center; border-bottom: 1px solid var(--accent-green); padding-bottom: 10px; }
        .nav-item { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover, .nav-item.active { background: var(--accent-green); }

        /* Content Area */
        .main-content { flex: 1; overflow-y: auto; padding: 20px; position: relative; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* Dashboard Cards */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; border-top: 4px solid var(--medium-green); box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card h3 { color: #666; font-size: 0.9rem; margin-bottom: 10px; }
        .card .value { font-size: 1.8rem; font-weight: bold; color: var(--accent-green); }

        /* Sections */
        .section { display: none; animation: fadeIn 0.5s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Tables */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: var(--accent-green); }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .badge-green { background: #d8f3dc; color: #1b4332; }
        .badge-red { background: #ffe5ec; color: var(--red-alert); }

        /* Map */
        #live-map { height: 600px; width: 100%; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* Charts */
        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-card { background: white; padding: 20px; border-radius: 12px; height: 350px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>V2V ROUTING</h2>
        <div class="nav-item active" onclick="showSection('vue-generale')"><i class="fas fa-chart-line"></i> Vue Générale</div>
        <div class="nav-item" onclick="showSection('chauffeurs')"><i class="fas fa-user-tie"></i> Chauffeurs</div>
        <div class="nav-item" onclick="showSection('routes')"><i class="fas fa-route"></i> Routes</div>
        <div class="nav-item" onclick="showSection('optimisation')"><i class="fas fa-percentage"></i> Optimisation</div>
        <div class="nav-item" onclick="showSection('carte-live')"><i class="fas fa-map-marked-alt"></i> Carte Live</div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <h1>Admin Dashboard</h1>
            <div>
                <span id="last-refresh" style="font-size: 0.8rem; color: #888; margin-right: 15px;"></span>
                <button onclick="fetchAllData()" style="background: var(--medium-green); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-sync"></i> Actualiser
                </button>
            </div>
        </div>

        <div class="kpi-grid" id="kpi-container">
            <div class="card"><h3>Chauffeurs Actifs</h3><div class="value" id="kpi-drivers">-</div></div>
            <div class="card"><h3>Colis Aujourd'hui</h3><div class="value" id="kpi-colis">-</div></div>
            <div class="card"><h3>Routes Planifiées</h3><div class="value" id="kpi-routes">-</div></div>
            <div class="card"><h3>Gain Total</h3><div class="value" id="kpi-gain">-</div> DT</div>
            <div class="card"><h3>Marge Moyenne</h3><div class="value" id="kpi-margin">-</div> %</div>
            <div class="card"><h3>Top Chauffeur</h3><div class="value" id="kpi-best" style="font-size: 1.2rem;">-</div></div>
        </div>

        <div id="vue-generale" class="section active">
            <div class="charts-container">
                <div class="chart-card"><canvas id="chart-gain"></canvas></div>
                <div class="chart-card"><canvas id="chart-colis"></canvas></div>
            </div>
        </div>

        <div id="chauffeurs" class="section">
            <table id="table-drivers">
                <thead><tr><th>Chauffeur</th><th>Colis</th><th>Gain (DT)</th><th>Marge %</th><th>Statut</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="routes" class="section">
            <table id="table-routes">
                <thead><tr><th># Route</th><th>Chauffeur</th><th>Colis</th><th>Dist (km)</th><th>Gain Net</th><th>Marge</th><th>Map</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="optimisation" class="section">
            <div class="chart-card" style="height: 500px; width: 100%;"><canvas id="chart-history-margin"></canvas></div>
        </div>

        <div id="carte-live" class="section">
            <div id="live-map"></div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api/admin";
        let map;

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
            if(id === 'carte-live') setTimeout(() => map.invalidateSize(), 200);
        }

        async function fetchAllData() {
            try {
                // KPIs
                const resSum = await fetch(`${API_BASE}/summary`);
                const sum = await resSum.json();
                document.getElementById('kpi-drivers').innerText = sum.active_drivers;
                document.getElementById('kpi-colis').innerText = sum.total_colis;
                document.getElementById('kpi-routes').innerText = sum.total_routes;
                document.getElementById('kpi-gain').innerText = sum.gain_total;
                document.getElementById('kpi-margin').innerText = sum.marge_moyenne;
                document.getElementById('kpi-best').innerText = sum.best_driver || "N/A";

                // Routes Table
                const resRoutes = await fetch(`${API_BASE}/routes`);
                const routes = await resRoutes.json();
                const routeBody = document.querySelector("#table-routes tbody");
                routeBody.innerHTML = "";
                routes.forEach(r => {
                    const row = `<tr>
                        <td>${r.route_id}</td>
                        <td>${r.driver_name}</td>
                        <td>${r.nb_colis}</td>
                        <td>${r.distance}</td>
                        <td style="color:${r.gain_net > 0 ? 'green':'red'}">${r.gain_net} DT</td>
                        <td><span class="badge ${r.margin_pct > 20 ? 'badge-green':'badge-red'}">${r.margin_pct}%</span></td>
                        <td><a href="${r.map_url}" target="_blank">🗺️ Ouvrir</a></td>
                    </tr>`;
                    routeBody.innerHTML += row;
                });

                document.getElementById('last-refresh').innerText = "Dernier refresh: " + new Date().toLocaleTimeString();
            } catch (e) { console.error("Erreur API:", e); }
        }

        // Initialisation Carte
        function initMap() {
            map = L.map('live-map').setView([36.806, 10.181], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }

        // Graphiques
        function initCharts() {
            const ctx1 = document.getElementById('chart-gain').getContext('2d');
            new Chart(ctx1, {
                type: 'line',
                data: { labels: ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'], datasets: [{ label: 'Gain Quotidien (DT)', data: [120, 190, 150, 210, 180], borderColor: '#2d6a4f', tension: 0.4 }] }
            });
        }

        window.onload = () => {
            initMap();
            initCharts();
            fetchAllData();
            setInterval(fetchAllData, 60000); // Auto refresh
        };
    </script>
</body>
</html>
